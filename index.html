<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DarkWear - Tienda de Ropa Alternativa</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            color: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 2rem;
        }
        
        .loading-container {
            text-align: center;
            padding: 2rem;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #6a1b9a;
            margin-bottom: 1.5rem;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .brand {
            font-size: 2.5rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: #999999;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #1a1a1a;
            border-top: 4px solid #6a1b9a;
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 1s linear infinite;
        }
        
        .loading-text {
            color: #666666;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <img src="assets/img/logo_gotic.jpg" alt="DarkWear Logo" class="logo" />
        <h1 class="brand">DarkWear</h1>
        <p class="subtitle">Moda alternativa para almas libres</p>
        <div class="spinner"></div>
        <p class="loading-text">Cargando...</p>
    </div>

    <script>
        
        setTimeout(function() {
            window.location.href = 'pages/home.html';
        }, 1500);
        
    
    </script>
</body>
</html>
