<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DarkWear - Tienda de Ropa Alternativa</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="../assets/img/logo_gotic.jpg" alt="DarkWear Logo" class="logo" />
            <span class="brand">DarkWear</span>
        </div>
        <nav>
            <ul>
                <li><a href="home.html" class="active">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html" class="active">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                
            </ul>
        </nav>
        <div class="acciones-usuario">
            <a href="login.html" class="btn-login">Iniciar sesión</a>

            <div class="cart-icon" id="cartIcon">
                <span class="cart-count" id="cartCount">0</span>
                <span class="cart-label">Carrito</span>
            </div>
        </div>
    </header>

    <main>
       
        <section class="hero" style="background-image: url('../assets/img/ropa_coleccion.jpg'); background-size: cover; background-position: center; min-height: 450px; display: flex; align-items: center; justify-content: center; text-align: center; position: relative;">
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);"></div>
            <div class="hero-content" style="position: relative; z-index: 1;">
                <h2 style="color: #ffffff;"></h2>
                <p style="color: #cccccc; font-size: 1.2rem;"></p>
                <a href="productos.html" class="btn">Ver colección</a>
            </div>
        </section>

            
        <section class="video-section">
            <h2>Descubre nuestra esencia</h2>
            <div class="video-container">
                <video controls>
                    <source src="../assets/video/video_ropa.mp4" type="video/mp4" />
                    Tu navegador no soporta el elemento de video.
                </video>
            </div>
        </section>

        <section class="destacados">
            <h2 class="section-title">Productos destacados</h2>
            <div class="productos-grid" id="productosDestacados">
                <!-- Los productos se generan automáticamente con JavaScript -->
            </div>
        </section>

        <!-- CARRITO DESPLEGABLE -->
        <div class="cart-dropdown" id="cartDropdown">
            <h3>Mi Carrito</h3>
            <div id="cartItems">
                <p class="cart-empty">El carrito está vacío</p>
            </div>
            <div class="cart-total" id="cartTotal">Total: $0</div>
            <button class="btn btn-checkout" id="checkoutBtn">Finalizar compra</button>
            <button class="btn btn-clear" id="clearCartBtn">Vaciar carrito</button>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 DarkWear - Tienda de ropa alternativa</p>
            <div class="footer-links">
                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
                <a href="#">TikTok</a>
            </div>
        </div>
    </footer>
    <script src="../js/productos-data.js"></script>
    <script src="../js/main.js"></script>
    
</body>
</html>
