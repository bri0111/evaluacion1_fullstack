<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - DarkWear</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="../assets/img/logo_gotic.jpg" alt="DarkWear Logo" class="logo" />
            <span class="brand">DarkWear</span>
        </div>
        <nav>
            <ul>
                <li><a href="home.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html" class="active">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="acciones-usuario">
            

            <div class="cart-icon" id="cartIcon">
                <span class="cart-count" id="cartCount">0</span>
                <span class="cart-label">Carrito</span>
            </div>
        </div>
    </header>
    <div class="cart-dropdown" id="cartDropdown">
            <h3>Mi Carrito</h3>
            <div id="cartItems">
                <p class="cart-empty">El carrito está vacío</p>
            </div>
            <div class="cart-total" id="cartTotal">Total: $0</div>
            <button class="btn btn-checkout" id="checkoutBtn">Finalizar compra</button>
            <button class="btn btn-clear" id="clearCartBtn">Vaciar carrito</button>
        </div>
    <main class="form-page">
        <section class="form-container">
            <h2>Iniciar sesión</h2>
            
            <!-- Mensaje de redirección -->
            <div id="redirectMessage" style="display: none; text-align: center; padding: 0.8rem; background-color: #e8f5e9; color: #2e7d32; border-radius: 4px; margin-bottom: 1rem;">
                ✅ Inicio de sesión exitoso. Redirigiendo...
            </div>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="email">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                        required
                    />
                    <span class="error-msg" id="emailError"></span>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Mínimo 6 caracteres"
                        autocomplete="current-password"
                        required
                    />
                    <span class="error-msg" id="passwordError"></span>
                </div>

                <div class="field checkbox">
                    <input type="checkbox" id="remember" />
                    <label for="remember">Recordarme</label>
                </div>

                <button type="submit" class="btn" id="loginBtn">Ingresar</button>
            </form>
            <p class="form-link">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 DarkWear - Tienda de ropa alternativa</p>
            <div class="footer-links">
                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
                <a href="#">TikTok</a>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
