<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - DarkWear</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="../assets/img/logo_gotic.jpg" alt="DarkWear Logo" class="logo" />
            <span class="brand">DarkWear</span>
        </div>
        <nav>
            <ul>
                <li><a href="home.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="terminos.html">Términos</a></li>
                <li><a href="privacidad.html">Privacidad</a></li>
            </ul>
        </nav>
        <div class="acciones-usuario">
            <a href="login.html" class="btn-login">Iniciar sesión</a>
            <div class="cart-icon" id="cartIcon">
                <span class="cart-count" id="cartCount">0</span>
                <span class="cart-label">Carrito</span>
            </div>
        </div>
    </header>

    <main class="form-page">
        <section class="form-container">
            <h2>Contacto</h2>
            <form id="contactForm" novalidate>
                <div class="field">
                    <label for="nombre">Nombre completo</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        placeholder="Tu nombre"
                        autocomplete="name"
                        required
                    />
                    <span class="error-msg" id="nombreError"></span>
                </div>
                <div class="field">
                    <label for="emailContacto">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="emailContacto" 
                        placeholder="tu@duoc.cl"
                        autocomplete="email"
                        required
                    />
                    <span class="error-msg" id="emailContactoError"></span>
                </div>
                <div class="field">
                    <label for="telefono">Teléfono (opcional)</label>
                    <input 
                        type="tel" 
                        id="telefono" 
                        placeholder="+56 9 1234 5678"
                        autocomplete="tel"
                    />
                </div>
                <div class="field">
                    <label for="asunto">Asunto</label>
                    <select id="asunto">
                        <option value="">Selecciona un asunto</option>
                        <option value="consulta">Consulta</option>
                        <option value="reclamo">Reclamo</option>
                        <option value="sugerencia">Sugerencia</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>
                <div class="field">
                    <label for="mensaje">Mensaje</label>
                    <textarea 
                        id="mensaje" 
                        rows="4" 
                        placeholder="Escribe tu mensaje aquí..."
                        required
                    ></textarea>
                    <span class="error-msg" id="mensajeError"></span>
                </div>
                <button type="submit" class="btn">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 DarkWear - Tienda de ropa alternativa</p>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/contacto.js"></script>
</body>
</html>
